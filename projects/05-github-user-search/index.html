
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Search GitHub users and explore their public profiles and repositories."
  >
  <title>GitHub User Search</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">JavaScript Project</p>

          <h1>GitHub User Search</h1>

          <p class="subtitle">
            Search for a GitHub user and explore public profile data.
          </p>
        </div>
      </header>

      <section class="search-section">
        <form id="searchForm" class="search-form">
          <label class="sr-only" for="usernameInput">
            GitHub username
          </label>

          <input
            id="usernameInput"
            name="username"
            type="search"
            placeholder="Enter a GitHub username..."
            autocomplete="off"
            maxlength="39"
            required
          >

          <button
            id="searchButton"
            type="submit"
            class="primary-button"
          >
            Search
          </button>
        </form>

        <p
          id="searchError"
          class="message error-message"
          role="alert"
          hidden
        ></p>
      </section>

      <section
        id="statusMessage"
        class="message status-message"
        aria-live="polite"
        hidden
      ></section>

      <section
        id="profileSection"
        class="profile-section"
        hidden
      >
        <header class="profile-header">
          <img
            id="avatar"
            class="avatar"
            src=""
            alt=""
          >

          <div class="profile-main">
            <div class="profile-title">
              <div>
                <h2 id="name">-</h2>

                <a
                  id="username"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  @-
                </a>
              </div>

              <a
                id="profileLink"
                class="secondary-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                View Profile
              </a>
            </div>

            <p id="bio" class="bio">
              -
            </p>

            <div class="profile-meta">
              <span id="location">-</span>
              <span id="company">-</span>
              <span id="blog">-</span>
            </div>
          </div>
        </header>

        <div
          class="stats"
          aria-label="GitHub profile statistics"
        >
          <article class="stat-card">
            <span>Repositories</span>
            <strong id="publicRepos">0</strong>
          </article>

          <article class="stat-card">
            <span>Followers</span>
            <strong id="followers">0</strong>
          </article>

          <article class="stat-card">
            <span>Following</span>
            <strong id="following">0</strong>
          </article>

          <article class="stat-card">
            <span>Gists</span>
            <strong id="publicGists">0</strong>
          </article>
        </div>

        <section class="repositories-section">
          <div class="section-heading">
            <div>
              <h3>Recent Repositories</h3>
              <p id="repositoryCount">
                0 repositories
              </p>
            </div>
          </div>

          <div
            id="repositoryList"
            class="repository-list"
          ></div>

          <p
            id="repositoryEmpty"
            class="empty-state"
            hidden
          >
            No public repositories found.
          </p>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
